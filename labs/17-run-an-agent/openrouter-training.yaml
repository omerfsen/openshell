# OpenRouter provider profile for the training, adapted from NVIDIA's example
# (providers/openrouter.yaml at v0.1.4). Changes: a separate id, and curl added
# to `binaries` so you can test the credential path before running an agent.
#
# Credential scope: OPENROUTER_API_KEY, sent as a bearer token to openrouter.ai
# and nowhere else.
id: openrouter-training
display_name: OpenRouter (training)
description: OpenRouter inference API for OpenCode and curl
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/opencode
  - /usr/bin/curl
